[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-data-platform-databricks"
version = "0.1.0"
description = "Production-style energy data platform using PySpark and Delta Lake"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pyspark==3.5.3",
  "delta-spark==3.2.1",
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

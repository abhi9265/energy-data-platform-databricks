name: Benchmark

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Synthetic meter readings"
        required: true
        default: "100000"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Run benchmark
        env:
          BENCHMARK_ROWS: ${{ inputs.rows }}
          BENCHMARK_OUT: benchmark-results
        run: python benchmarks/run_benchmark.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: energy-benchmark-${{ inputs.rows }}-rows
          path: benchmark-results/
      - name: Print benchmark summary
        run: cat benchmark-results/results.json

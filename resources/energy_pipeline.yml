resources:
  jobs:
    energy_daily_pipeline:
      name: energy-daily-pipeline
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Workspace/Shared/energy-data-platform/notebooks/01_bronze_energy_ingestion
        - task_key: silver_quality
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Workspace/Shared/energy-data-platform/notebooks/02_silver_quality_pipeline
        - task_key: gold_analytics
          depends_on:
            - task_key: silver_quality
          notebook_task:
            notebook_path: /Workspace/Shared/energy-data-platform/notebooks/03_gold_analytics_pipeline
